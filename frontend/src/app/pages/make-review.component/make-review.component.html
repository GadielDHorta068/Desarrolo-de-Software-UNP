<div class="min-h-screen bg-gray-900 text-gray-100 flex items-center justify-center p-6">
  <div class="bg-gray-800 rounded-2xl shadow-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-semibold mb-6 text-center text-yellow-400">
      Dejar una reseña del evento
    </h2>

    <!-- EMAIL -->
    <div class="mb-5">
      <label class="block text-sm font-medium mb-2">
        Correo electrónico
      </label>
      <input
        type="email"
        [(ngModel)]="review.email"
        placeholder="tuemail@ejemplo.com"
        class="w-full p-3 rounded-lg bg-gray-700 text-gray-100 border border-gray-600 focus:ring-2 focus:ring-yellow-400 focus:outline-none"
      />
    </div>

    <!-- ENTREGA DEL PREMIO -->
    <div class="mb-5">
      <label class="block text-sm font-medium mb-2">
        ¿Cuando recibiste el premio?
      </label>

      <select
        [(ngModel)]="review.delivery"
        (ngModelChange)="onDeliveryChange()"
        class="w-full p-3 rounded-lg bg-gray-700 text-gray-100 border border-gray-600 focus:ring-2 focus:ring-yellow-400 focus:outline-none"
      >
        <option [ngValue]="null" disabled>
            Seleccione una opción
        </option>
        
        <option [ngValue]="deliveryStatus.NO_RECIBIDO">
          No recibido
        </option>

        <option [ngValue]="deliveryStatus.ANTES_DE_LA_FECHA_ACORDADA">
          Antes de la fecha acordada
        </option>

        <option [ngValue]="deliveryStatus.EN_LA_FECHA_ACORDADA">
          En la fecha acordada
        </option>

        <option [ngValue]="deliveryStatus.DESPUES_DE_LA_FECHA_ACORDADA">
          Después de la fecha acordada
        </option>
      </select>
    </div>

    <!-- CALIDAD DEL PREMIO -->
    <div
      class="mb-5"
      *ngIf="review.delivery &&
        review.delivery !== deliveryStatus.NO_RECIBIDO"
    >
      <label class="block text-sm font-medium mb-2">
        ¿El premio era de la calidad que esperabas?
      </label>

      <select
        [(ngModel)]="review.awardAlingment"
        class="w-full p-3 rounded-lg bg-gray-700 text-gray-100 border border-gray-600 focus:ring-2 focus:ring-yellow-400 focus:outline-none"
      >
        <option [ngValue]="null" disabled>
            Seleccione una opción
        </option>

        <option [ngValue]="awardAlignmentOptions.ES_LO_QUE_ESPERABA">
          Es de la calidad que esperaba
        </option>

        <option [ngValue]="awardAlignmentOptions.PARCIALMENTE">
          Parcialmente
        </option>

        <option [ngValue]="awardAlignmentOptions.NO_ES_LO_QUE_ESPERABA">
          No es de la calidad que esperaba
        </option>
      </select>
    </div>

    <!-- COMUNICACIÓN -->
    <div class="mb-5">
      <label class="block text-sm font-medium mb-2">
        ¿Cómo fue la comunicación con el organizador?
      </label>

      <select
        [(ngModel)]="review.communicationRating"
        class="w-full p-3 rounded-lg bg-gray-700 text-gray-100 border border-gray-600 focus:ring-2 focus:ring-yellow-400 focus:outline-none"
      >
        <option [ngValue]="null" disabled>
            Seleccione una opción
        </option>

        <option [ngValue]="communicationRatingOptions.EXCELENTE">
          Excelente
        </option>

        <option [ngValue]="communicationRatingOptions.BUENA">
          Buena
        </option>

        <option [ngValue]="communicationRatingOptions.REGULAR">
          Regular
        </option>

        <option [ngValue]="communicationRatingOptions.MALA">
          Mala
        </option>
      </select>
    </div>

    <!-- PUNTUACIÓN -->
    <div class="mb-5">
      <label class="block text-sm font-medium mb-2">
        Calificación general
      </label>

      <app-star-rating
        [rating]="review.score"
        [readonly]="false"
        (ratingChange)="review.score = $event">
      </app-star-rating>
    </div>

    <!-- COMENTARIO -->
    <div class="mb-6">
      <label class="block text-sm font-medium mb-2">
        Comentario
      </label>

      <textarea
        [(ngModel)]="review.comment"
        placeholder="Escribe tu opinión aquí..."
        rows="4"
        class="w-full p-3 rounded-lg bg-gray-700 text-gray-100 border border-gray-600 focus:ring-2 focus:ring-yellow-400 focus:outline-none resize-none"
      ></textarea>
    </div>

    <!-- BOTÓN -->
    <button
      (click)="enviarReview()"
      class="w-full py-3 rounded-lg bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-semibold transition-colors"
    >
      Enviar reseña
    </button>
  </div>
</div>
